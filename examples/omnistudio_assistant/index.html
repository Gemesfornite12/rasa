<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1120">
  <link rel="icon" href="data:,">
  <title>Sara · OmniStudio</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #080d1b; color: #f8fafc; display: grid; place-items: center; padding: 16px; }
    .app { width: min(100%, 760px); height: min(900px, calc(100vh - 32px)); min-height: 560px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #26334d; border-radius: 24px; background: #10182a; box-shadow: 0 24px 80px #0008; }
    header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid #26324b; background: #121c31; }
    .avatar { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: linear-gradient(135deg,#818cf8,#c084fc); font-weight: 800; font-size: 20px; }
    .brand { flex: 1; min-width: 0; } .brand strong { display: block; font-size: 16px; } .brand span { color: #a5b4fc; font-size: 12px; }
    .status { color: #cbd5e1; font-size: 11px; }
    #account { display: none; align-items: center; gap: 10px; min-width: 0; }
    #accountEmail { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #cbd5e1; font-size: 12px; }
    .smallButton { border: 1px solid #475569; border-radius: 10px; background: transparent; color: #e2e8f0; padding: 8px 10px; cursor: pointer; }
    #authPanel { margin: auto; width: min(100% - 32px, 390px); padding: 24px; border: 1px solid #33415e; border-radius: 18px; background: #151f33; }
    #authPanel h1 { margin: 0 0 8px; font-size: 22px; } #authPanel p { color: #aab7ce; line-height: 1.5; font-size: 13px; }
    .googleButton, .primaryButton { width: 100%; border: 0; border-radius: 12px; padding: 12px 14px; background: #6366f1; color: white; font-size: 14px; font-weight: 650; cursor: pointer; }
    .googleButton { margin: 6px 0 16px; background: #f8fafc; color: #182033; }
    .googleMark { display: inline-grid; place-items: center; margin-right: 7px; width: 20px; height: 20px; border-radius: 50%; background: conic-gradient(#4285f4 0 25%,#34a853 25% 50%,#fbbc05 50% 75%,#ea4335 75%); color: white; font-size: 11px; font-weight: 800; }
    label { display: block; margin: 10px 0 6px; color: #cbd5e1; font-size: 12px; }
    input { width: 100%; border: 1px solid #37445e; outline: 0; border-radius: 11px; padding: 12px; background: #0d1526; color: white; font-size: 14px; }
    input:focus { border-color: #818cf8; }
    #authError, #chatError { min-height: 18px; color: #fca5a5; font-size: 12px; line-height: 1.45; }
    #messages { display: none; flex: 1; overflow: auto; flex-direction: column; gap: 14px; padding: 20px; }
    .msg { max-width: 84%; padding: 12px 14px; border-radius: 17px; line-height: 1.5; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .bot { align-self: flex-start; background: #202b42; border-bottom-left-radius: 5px; }
    .user { align-self: flex-end; background: #5557d9; border-bottom-right-radius: 5px; }
    .time { display: block; margin-top: 6px; opacity: .62; font-size: 10px; text-align: right; }
    #composer { display: none; gap: 10px; padding: 12px; border-top: 1px solid #26324b; background: #121c31; }
    #messageInput { flex: 1; min-width: 0; }
    #sendButton { width: 48px; border: 0; border-radius: 12px; background: #6366f1; color: white; font-size: 20px; cursor: pointer; }
    #sendButton:disabled { opacity: .55; cursor: wait; }
    footer { padding: 0 16px 12px; background: #121c31; text-align: center; color: #8492aa; font-size: 10px; }
    @media (max-width: 520px) { body { padding: 0; } .app { width: 100%; height: 100dvh; min-height: 0; border-radius: 0; border: 0; } header { padding: 13px; } #accountEmail { max-width: 105px; } #messages { padding: 16px 12px; } }
  </style>
</head>
<body>
  <main class="app" aria-label="Chat web de Sara">
    <header>
      <div class="avatar" aria-hidden="true">S</div>
      <div class="brand"><strong>Sara</strong><span>Asistente de OmniStudio · Rasa + Felo</span></div>
      <div class="status" id="connectionStatus">Conectando…</div>
      <div id="account"><span id="accountEmail"></span><button id="signOutButton" class="smallButton" type="button">Salir</button></div>
    </header>

    <section id="authPanel" aria-labelledby="authTitle">
      <h1 id="authTitle">Inicia sesión</h1>
      <p>Usa la cuenta de Firebase que ya tienes en OmniStudio. Tus mensajes se envían al gateway de Sara; esta página no los guarda en el navegador.</p>
      <button id="googleButton" class="googleButton" type="button"><span class="googleMark" aria-hidden="true">G</span>Continuar con Google</button>
      <form id="emailForm">
        <label for="email">Correo</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <div style="height:12px"></div>
        <button class="primaryButton" type="submit">Entrar con correo</button>
      </form>
      <div id="authError" role="status"></div>
    </section>

    <section id="messages" aria-live="polite"></section>
    <form id="composer">
      <input id="messageInput" maxlength="4000" autocomplete="off" placeholder="Escribe un mensaje…" aria-label="Mensaje">
      <button id="sendButton" type="submit" aria-label="Enviar mensaje">➤</button>
    </form>
    <div id="chatError" role="status"></div>
    <footer>La biblioteca de aprendizaje solo guarda notas después de tu confirmación.</footer>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword,
      onAuthStateChanged, signOut, setPersistence, browserSessionPersistence
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCdATx7UVnbN7FiIoyXyvNnplq2hoSt_BQ",
      authDomain: "omnistudio-caaf5.firebaseapp.com",
      databaseURL: "https://omnistudio-caaf5-default-rtdb.firebaseio.com",
      projectId: "omnistudio-caaf5",
      storageBucket: "omnistudio-caaf5.firebasestorage.app",
      messagingSenderId: "611449222458",
      appId: "1:611449222458:web:52bfed9bb25629a3794c03"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const persistenceReady = setPersistence(auth, browserSessionPersistence).catch(() => {});
    const provider = new GoogleAuthProvider();
    const authPanel = document.getElementById('authPanel');
    const authError = document.getElementById('authError');
    const chatError = document.getElementById('chatError');
    const messages = document.getElementById('messages');
    const composer = document.getElementById('composer');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');
    const connectionStatus = document.getElementById('connectionStatus');
    const account = document.getElementById('account');

    function authErrorText(code) {
      if (code === 'auth/popup-blocked') return 'El navegador bloqueó la ventana. Permite la ventana emergente e inténtalo otra vez.';
      if (code === 'auth/popup-closed-by-user') return 'Se cerró la ventana de inicio de sesión.';
      if (code === 'auth/invalid-credential' || code === 'auth/wrong-password' || code === 'auth/user-not-found') return 'El correo o la contraseña no coinciden.';
      if (code === 'auth/unauthorized-domain') return 'Este dominio aún no está autorizado en Firebase Authentication.';
      return 'No se pudo iniciar sesión. Revisa la conexión e inténtalo de nuevo.';
    }

    document.getElementById('googleButton').addEventListener('click', async () => {
      authError.textContent = '';
      try { await persistenceReady; await signInWithPopup(auth, provider); }
      catch (error) { authError.textContent = authErrorText(error.code); }
    });

    document.getElementById('emailForm').addEventListener('submit', async event => {
      event.preventDefault();
      authError.textContent = '';
      try {
        await persistenceReady;
        await signInWithEmailAndPassword(auth, document.getElementById('email').value.trim(), document.getElementById('password').value);
      } catch (error) { authError.textContent = authErrorText(error.code); }
    });

    document.getElementById('signOutButton').addEventListener('click', () => signOut(auth));

    function addMessage(text, kind) {
      const bubble = document.createElement('div');
      bubble.className = `msg ${kind}`;
      bubble.textContent = text;
      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = new Date().toLocaleTimeString('es-CR', { hour: '2-digit', minute: '2-digit' });
      bubble.appendChild(time);
      messages.appendChild(bubble);
      messages.scrollTop = messages.scrollHeight;
    }

    onAuthStateChanged(auth, async user => {
      const loggedIn = Boolean(user);
      authPanel.style.display = loggedIn ? 'none' : 'block';
      messages.style.display = loggedIn ? 'flex' : 'none';
      composer.style.display = loggedIn ? 'flex' : 'none';
      account.style.display = loggedIn ? 'flex' : 'none';
      connectionStatus.textContent = loggedIn ? 'Sesión lista' : 'Acceso protegido';
      document.getElementById('accountEmail').textContent = user?.email || 'Sesión activa';
      if (loggedIn && messages.childElementCount === 0) {
        addMessage('Hola, soy Sara. Ya puedes escribirme; responderé mediante Rasa y usaré Felo solo si Rasa activa el fallback.', 'bot');
      }
      if (!loggedIn) messages.replaceChildren();
    });

    composer.addEventListener('submit', async event => {
      event.preventDefault();
      const text = messageInput.value.trim();
      const user = auth.currentUser;
      if (!text || !user || sendButton.disabled) return;
      messageInput.value = '';
      chatError.textContent = '';
      addMessage(text, 'user');
      sendButton.disabled = true;
      try {
        const token = await user.getIdToken();
        const response = await fetch('/webhooks/rest/webhook', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ message: text })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          if (response.status === 401) throw new Error('La sesión venció. Sal y vuelve a iniciar sesión.');
          if (response.status === 503) throw new Error('Sara todavía está iniciando. Inténtalo en un momento.');
          throw new Error('No se pudo enviar el mensaje. Inténtalo otra vez.');
        }
        const replies = Array.isArray(data) ? data : [];
        const texts = replies.map(item => item && typeof item.text === 'string' ? item.text.trim() : '').filter(Boolean);
        if (texts.length) texts.forEach(textReply => addMessage(textReply, 'bot'));
        else addMessage('Sara no devolvió texto esta vez. Puedes intentar de nuevo.', 'bot');
      } catch (error) {
        chatError.textContent = error.message || 'No se pudo conectar con Sara.';
      } finally {
        sendButton.disabled = false;
        messageInput.focus();
      }
    });

  </script>
</body>
</html>
